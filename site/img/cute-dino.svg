<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Cute cartoon dinosaur">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ee8a2"/>
      <stop offset="1" stop-color="#3fc57a"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c9"/>
      <stop offset="1" stop-color="#ffe08a"/>
    </linearGradient>
    <radialGradient id="cheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7fa8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ff7fa8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="200" cy="364" rx="112" ry="14" fill="#000" opacity=".14"/>

  <!-- tail -->
  <path d="M96 292 C48 296 24 270 18 238 C34 252 50 254 70 244 C82 240 96 262 112 262 Z" fill="#3fc57a"/>
  <path d="M30 246 C42 256 58 258 74 250" fill="none" stroke="#2fa564" stroke-width="3" stroke-linecap="round" opacity=".6"/>

  <!-- back spikes -->
  <g fill="#ffb347" stroke="#f08f1c" stroke-width="3" stroke-linejoin="round">
    <path d="M118 188 L98 150 L142 168 Z"/>
    <path d="M150 156 L140 112 L180 140 Z"/>
    <path d="M184 140 L186 96 L218 130 Z"/>
    <path d="M222 138 L236 98 L258 138 Z"/>
  </g>

  <!-- back leg (far) -->
  <rect x="226" y="300" width="46" height="52" rx="22" fill="#34b56d"/>
  <ellipse cx="252" cy="352" rx="30" ry="14" fill="#34b56d"/>

  <!-- body -->
  <ellipse cx="190" cy="262" rx="104" ry="92" fill="url(#body)"/>
  <!-- belly -->
  <ellipse cx="206" cy="284" rx="62" ry="64" fill="url(#belly)"/>
  <path d="M160 270 q46 14 92 0 M156 292 q50 16 100 0 M164 314 q42 12 84 0" fill="none" stroke="#f3cb6a" stroke-width="3" stroke-linecap="round" opacity=".8"/>

  <!-- front leg -->
  <rect x="140" y="304" width="48" height="50" rx="22" fill="#3fc57a"/>
  <ellipse cx="166" cy="354" rx="32" ry="15" fill="#3fc57a"/>
  <g fill="#fff" stroke="#2fa564" stroke-width="2">
    <ellipse cx="146" cy="358" rx="6" ry="7"/>
    <ellipse cx="166" cy="362" rx="6" ry="7"/>
    <ellipse cx="186" cy="358" rx="6" ry="7"/>
  </g>

  <!-- tiny arm -->
  <path d="M258 252 C282 248 292 262 286 274 C280 284 264 278 258 270 Z" fill="#3fc57a" stroke="#2fa564" stroke-width="3" stroke-linejoin="round"/>

  <!-- neck + head -->
  <path d="M236 206 C250 170 262 150 282 138 L322 154 C314 196 296 226 262 238 Z" fill="url(#body)"/>
  <ellipse cx="296" cy="124" rx="76" ry="66" fill="url(#body)"/>
  <!-- head spikes / frill -->
  <g fill="#ffb347" stroke="#f08f1c" stroke-width="3" stroke-linejoin="round">
    <path d="M236 88 L222 54 L256 70 Z"/>
    <path d="M262 66 L258 28 L290 52 Z"/>
  </g>
  <!-- snout -->
  <ellipse cx="344" cy="142" rx="38" ry="30" fill="#7ee8a2"/>
  <!-- nostrils -->
  <ellipse cx="358" cy="130" rx="3.6" ry="4.6" fill="#2fa564"/>
  <ellipse cx="342" cy="128" rx="3.2" ry="4.2" fill="#2fa564"/>

  <!-- eye -->
  <ellipse cx="300" cy="112" rx="21" ry="25" fill="#fff"/>
  <ellipse cx="305" cy="116" rx="14" ry="18" fill="#26324a"/>
  <circle cx="310" cy="108" r="6.2" fill="#fff"/>
  <circle cx="300" cy="123" r="2.8" fill="#fff"/>
  <!-- eyebrow -->
  <path d="M282 84 q18 -12 36 -2" fill="none" stroke="#2fa564" stroke-width="4" stroke-linecap="round"/>

  <!-- cheek blush -->
  <ellipse cx="318" cy="150" rx="22" ry="14" fill="url(#cheek)"/>

  <!-- smile -->
  <path d="M326 158 q16 16 36 0" fill="none" stroke="#26324a" stroke-width="4" stroke-linecap="round"/>
  <path d="M340 166 q8 10 16 0 z" fill="#ff8aa6"/>

  <!-- little sparkles -->
  <g fill="#fff" opacity=".95">
    <path d="M60 110 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 l14 -6 z"/>
    <path d="M348 58 l4 9 l9 4 l-9 4 l-4 9 l-4 -9 l-9 -4 l9 -4 z"/>
    <path d="M92 60 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z"/>
  </g>
  <!-- heart -->
  <path d="M120 96 c-8 -14 -28 -4 -18 12 c6 10 18 16 18 16 s12 -6 18 -16 c10 -16 -10 -26 -18 -12 z" fill="#ff7fa8"/>
</svg>
